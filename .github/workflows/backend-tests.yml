name: Backend tests

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests (PHP 8.5 / MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: tdd_ai_app_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql_test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tdd_ai_app_db_test
      DB_DATABASE_TEST: tdd_ai_app_db_test
      DB_USERNAME: root
      DB_PASSWORD: ci_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, bcmath, dom, xml, curl, zip
          coverage: none
          tools: composer:v2

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Run backend tests
        run: composer test -- --compact